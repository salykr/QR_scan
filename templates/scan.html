<!DOCTYPE html>
<html>
<head>
    <title>Scan QR Code</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <h2>Scan QR Code to Link Device</h2>
    <div id="reader" style="width: 300px;"></div>
    <p id="scan-result" style="margin-top: 15px;"></p>

    <form id="qr-form" method="POST" action="/validate-login" style="display: none;">
        <input type="hidden" name="scanned_qr" id="scanned_qr">
        <button type="submit">Validate</button>
    </form>

    <script>
        const resultElement = document.getElementById('scan-result');
        const form = document.getElementById('qr-form');
        const hiddenInput = document.getElementById('scanned_qr');

        function onScanSuccess(decodedText, decodedResult) {
            resultElement.innerText = "Scanned: " + decodedText;

            // Set the hidden input value and show the form
            hiddenInput.value = decodedText;
            form.style.display = "block";

            // Stop scanning after successful scan
            html5QrCode.stop();
        }

        let html5QrCode;

        async function startScanner() {
            html5QrCode = new Html5Qrcode("reader");

            const devices = await Html5Qrcode.getCameras();

            if (devices && devices.length) {
                let backCamera = devices.find(device => device.label.toLowerCase().includes('back'));

                let cameraId = backCamera ? backCamera.id : devices[0].id; // fallback if no "back" camera labeled

                html5QrCode.start(
                    cameraId,
                    {
                        fps: 10,
                        qrbox: 250
                    },
                    onScanSuccess
                );
            } else {
                alert("No camera found!");
            }
        }

        // Start scanning when page loads
        window.onload = startScanner;
    </script>
</body>
</html>
