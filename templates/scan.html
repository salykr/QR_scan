<!DOCTYPE html>
<html>
<head>
    <title>Scan QR Code to Link Device</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <h2>Scan QR Code to Link Device</h2>
    <div id="reader" style="width: 300px;"></div>
    <p id="scan-result" style="margin-top: 15px;"></p>

    <script>
        const resultElement = document.getElementById('scan-result');
        let html5QrCode;

        async function sendToServer(decodedText) {
            try {
                const response = await fetch("/validate-login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        scanned_qr: decodedText
                    })
                });

                if (response.ok) {
                    window.location.href = "/home";  // redirect to home after success
                } else {
                    const text = await response.text();
                    alert("Validation failed:\n" + text);
                }
            } catch (err) {
                alert("Error sending QR data to server.");
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            resultElement.innerText = "Scanned: " + decodedText;
            html5QrCode.stop();  // stop scanner
            sendToServer(decodedText);  // send to Flask backend immediately
        }

        async function startScanner() {
            html5QrCode = new Html5Qrcode("reader");

            const devices = await Html5Qrcode.getCameras();
            if (devices && devices.length) {
                let backCamera = devices.find(device =>
                    device.label.toLowerCase().includes('back')
                );
                let cameraId = backCamera ? backCamera.id : devices[0].id;

                html5QrCode.start(
                    cameraId,
                    { fps: 10, qrbox: 250 },
                    onScanSuccess
                );
            } else {
                alert("No camera found.");
            }
        }

        window.onload = startScanner;
    </script>
</body>
</html>
