<!DOCTYPE html>
<html>
<head>
    <title>Phone B - QR Login</title>
    <script src="{{ url_for('static', filename='qrcode.min.js') }}"></script>
</head>
<body>
    <h2>Phone B: Login via QR Code</h2>
    <button onclick="startLogin()">Start Login</button>
    <div id="qrcode" style="margin-top: 20px;"></div>
    <p id="sessionInfo" style="margin-top: 10px;"></p>

    <script>
        let refreshInterval;

        async function fetchNewLoginSession() {
            const response = await fetch('/start-login');
            const data = await response.json();

            const sessionData = {
                loginSessionId: data.loginSessionId,
                secret: data.secret
            };

            // Display session info
            document.getElementById('sessionInfo').innerText =
                `Session ID: ${sessionData.loginSessionId}\nSecret: ${sessionData.secret}`;

            // Generate QR
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous QR
            new QRCode(qrContainer, {
                text: JSON.stringify(sessionData),
                width: 200,
                height: 200
            });
        }

        function startLogin() {
            fetchNewLoginSession(); // Fetch first time immediately

            // Then set interval to refresh QR every 30 seconds
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            refreshInterval = setInterval(fetchNewLoginSession, 30000); // 30 seconds
        }
    </script>
</body>
</html>
